[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sifry"
version = "0.2.0"
description = "Substituční šifra + kryptoanalýza M-H algoritmem"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Jozef Waldhauser" },
    { name = "Michael Minarcik" },
    { name = "Daniel Zikmund", email = "zikmund.d@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Czech",
]
dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
notebook = ["jupyter", "matplotlib>=3.3", "nbconvert"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sifry*"]
exclude = ["tests*", "docs*", "data*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
