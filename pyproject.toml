[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sifry"
version = "0.2.0"
description = "Substituční šifra + kryptoanalýza M-H algoritmem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Jozef Waldhauser" },
    { name = "Michael Minarcik" },
    { name = "Daniel Zikmund", email = "zikmund.d@gmail.com" },
]
dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
notebook = ["jupyter", "matplotlib>=3.3", "nbconvert"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sifry*"]
exclude = ["tests*", "docs*", "data*", "notebooks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
